[package]
name = "debug-to-jupyter-rust"
version = "1.0.0"
edition = "2021"
description = "Export a live Python variable from a debug session into a Jupyter Notebook"
repository = "https://github.com/sangnpq/memory2jupyter"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
